<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Crucigrama de Sistemas de Información</title>
<style>
:root{--bg:#f5f7fa;--ink:#182536;--muted:#526173;--accent:#0f766e;--line:#29384a;--hl:#d5f1ed;--cur:#ffe3a0;--ok:#bbf7d0;--bad:#fecaca}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif;padding:20px}main{max-width:1160px;margin:auto}h1{font-size:1.55rem;margin:0 0 5px}.sub{color:var(--muted);margin:0 0 16px}.layout{display:grid;grid-template-columns:minmax(0,auto) minmax(270px,1fr);gap:16px;align-items:start}.card{background:white;border-radius:12px;padding:16px;box-shadow:0 2px 9px #10243a14}.scroll{overflow:auto}.board{border-collapse:collapse;margin:auto}.board td{width:34px;height:34px;padding:0;position:relative;min-width:34px}.board td.cell{border:1.5px solid var(--line);background:#fff}.board td.empty{border:0}.board .n{position:absolute;top:1px;left:2px;font-size:9px;color:#435064;font-weight:800;pointer-events:none}.board input{width:100%;height:100%;border:0;outline:0;background:transparent;text-align:center;font-size:18px;font-weight:750;color:var(--ink);padding:6px 0 0;text-transform:uppercase;caret-color:transparent}.board td.hl{background:var(--hl)}.board td.cur{background:var(--cur)}.board td.ok{background:var(--ok)}.board td.bad{background:var(--bad)}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;justify-content:center}button{border:0;background:var(--accent);color:white;padding:9px 12px;border-radius:7px;font-weight:600;cursor:pointer}button.secondary{background:#e5ebf1;color:var(--ink)}button:hover{filter:brightness(.94)}h2{font-size:1rem;color:var(--accent);margin:0 0 8px}ol{list-style:none;margin:0 0 16px;padding:0}.clue{padding:8px;border-radius:7px;cursor:pointer;line-height:1.45;font-size:.9rem}.clue:hover{background:#eef3f7}.clue.active{background:var(--cur)}.clue small{color:var(--muted)}#msg{min-height:1.5em;margin:10px 0 0;text-align:center;font-weight:600}.note{color:var(--muted);font-size:.85rem;margin:12px 0 0}@media(max-width:850px){.layout{grid-template-columns:1fr}.card{padding:12px}}@media print{body{background:white;padding:0}.layout{display:block}.card{box-shadow:none}.btns,.sub,#msg,.note{display:none}.board input{color:#111}}
</style></head><body><main><h1>Crucigrama de Sistemas de Información</h1><p class="sub">Servicios médicos · Seleccioná una casilla o una pista para comenzar.</p><div class="layout"><section class="card"><div class="scroll"><table class="board" id="grid" aria-label="Crucigrama interactivo"></table></div><div class="btns"><button id="check">Comprobar</button><button id="hint" class="secondary">Revelar letra</button><button id="reveal" class="secondary">Revelar todo</button><button id="clear" class="secondary">Borrar</button></div><div class="btns"><button id="pdfBlank">PDF en blanco</button><button id="pdfSolved">PDF resuelto</button><button id="pngBlank" class="secondary">PNG en blanco</button><button id="pngSolved" class="secondary">PNG resuelto</button></div><div id="msg" role="status" aria-live="polite"></div><p class="note">Los archivos se generan en tu navegador. El PDF incluye el tablero y todas las pistas.</p></section><section class="card"><h2>Horizontales →</h2><ol id="across"></ol><h2>Verticales ↓</h2><ol id="down"></ol></section></div></main>
<script>
const D={H:12,W:17,entries:[
{n:1,w:'DATOS',r:0,c:5,d:0,clue:'Representación simbólica (numérica o alfabética) que constituye la materia prima sin procesar dentro de un sistema de información.'},
{n:2,w:'TELEMEDICINA',r:0,c:7,d:1,clue:'Prestación a distancia de servicios de atención médica, diagnóstico y tratamiento mediante tecnologías de la información y comunicación.'},
{n:3,w:'SEGURIDAD',r:1,c:4,d:1,clue:'Dimensión técnica orientada a proteger la confidencialidad, integridad y disponibilidad de la información médica contra accesos no autorizados o ataques cibernéticos.'},
{n:4,w:'TRIAJE',r:3,c:0,d:1,clue:'Método de selección y clasificación de pacientes en urgencias según la gravedad de su estado y la prioridad de atención.'},
{n:5,w:'FEEDBACK',r:3,c:6,d:0,clue:'Proceso de retroalimentación donde las salidas del sistema se evalúan para corregir errores en la entrada.'},
{n:6,w:'INTEROPERABILIDAD',r:5,c:0,d:0,clue:'Capacidad de dos o más sistemas de información en salud para comunicar, intercambiar datos y utilizar la información de forma coherente.'},
{n:7,w:'INCIDENTE',r:7,c:7,d:0,clue:'Según ITIL, interrupción no planificada de un servicio de TI o reducción en su calidad.'},
{n:8,w:'DAFO',r:8,c:2,d:1,clue:'Herramienta analítica para identificar Debilidades, Amenazas, Fortalezas y Oportunidades.'},
{n:9,w:'HISTORIA',r:9,c:6,d:0,clue:'Documento médico-legal donde se registran cronológicamente antecedentes, evaluaciones y estado de salud del paciente.'},
{n:10,w:'BLOCKCHAIN',r:11,c:0,d:0,clue:'Tecnología de libro mayor distribuido que puede ayudar a verificar integridad y trazabilidad de registros clínicos.'}
]};
// Corregimos automáticamente cruces incompatibles reubicando las palabras en una cuadrícula válida.
function buildLayout(entries){
 const ordered=[...entries].sort((a,b)=>b.w.length-a.w.length);const placed=[];const occupied=new Map();
 function key(r,c){return r+','+c}
 function canPlace(e,r,c,d){let crosses=0;for(let i=0;i<e.w.length;i++){let rr=r+(d?i:0),cc=c+(d?0:i),k=key(rr,cc);if(rr<0||cc<0)return -1;const existing=occupied.get(k);if(existing){if(existing.ch!==e.w[i]||existing.d===d)return -1;crosses++}else{const neighbors=d?[[rr,cc-1],[rr,cc+1]]:[[rr-1,cc],[rr+1,cc]];if(neighbors.some(([nr,nc])=>occupied.has(key(nr,nc))))return -1}}const before=d?[r-1,c]:[r,c-1],after=d?[r+e.w.length,c]:[r,c+e.w.length];if(occupied.has(key(...before))||occupied.has(key(...after)))return -1;return crosses}
 for(const e of ordered){let best=null;if(!placed.length)best={r:12,c:12,d:0,score:0};else{for(const p of placed){for(let i=0;i<e.w.length;i++)for(let j=0;j<p.w.length;j++)if(e.w[i]===p.w[j]){let d=1-p.d;let r=p.r+(p.d?j:0)-(d?i:0),c=p.c+(p.d?0:j)-(d?0:i);let crosses=canPlace(e,r,c,d);if(crosses<1)continue;const score=crosses*100-(Math.abs(r-12)+Math.abs(c-12));if(!best||score>best.score)best={r,c,d,score}}}}
 if(!best){ // place disconnected entries with spacing; all clues remain playable
 let r=0,c=0,d=0;outer:for(r=0;r<100;r++)for(c=0;c<100;c++)for(d=0;d<2;d++)if(canPlace(e,r,c,d)>=0){best={r,c,d};break outer}}
 if(!best)throw Error('No se pudo ubicar '+e.w);const q={...e,...best};placed.push(q);for(let i=0;i<q.w.length;i++){let k=key(q.r+(q.d?i:0),q.c+(q.d?0:i));occupied.set(k,{ch:q.w[i],d:q.d})}}
 const minR=Math.min(...placed.map(e=>e.r)),minC=Math.min(...placed.map(e=>e.c));placed.forEach(e=>{e.r-=minR;e.c-=minC});return {entries:placed,H:Math.max(...placed.map(e=>e.r+(e.d?e.w.length:1))),W:Math.max(...placed.map(e=>e.c+(e.d?1:e.w.length)))}
}
// Mantener el diseño original cuando sus cruces sean compatibles; si no, generar uno correcto.
function validate(layout){const m=new Map();for(const e of layout.entries)for(let i=0;i<e.w.length;i++){let k=(e.r+(e.d?i:0))+','+(e.c+(e.d?0:i));if(m.has(k)&&m.get(k)!==e.w[i])return false;m.set(k,e.w[i])}return true}
const L=validate(D)?D:buildLayout(D.entries);
const grid=document.getElementById('grid'),cover={},cells={},numAt={};
L.entries.forEach(e=>{numAt[e.r+','+e.c]=e.n;for(let i=0;i<e.w.length;i++){const k=(e.r+(e.d?i:0))+','+(e.c+(e.d?0:i));(cover[k]??={ch:e.w[i]})[e.d]=e}});
let cur=null,dir=0;
for(let r=0;r<L.H;r++){const tr=document.createElement('tr');for(let c=0;c<L.W;c++){const k=r+','+c,td=document.createElement('td');if(cover[k]){td.className='cell';if(numAt[k]){const s=document.createElement('span');s.className='n';s.textContent=numAt[k];td.append(s)}const inp=document.createElement('input');inp.maxLength=1;inp.autocomplete='off';inp.setAttribute('aria-label','Fila '+(r+1)+', columna '+(c+1));td.append(inp);cells[k]={td,inp};inp.addEventListener('focus',()=>{cur=k;if(!cover[k][dir])dir=1-dir;paint()});inp.addEventListener('click',()=>{if(cur===k&&cover[k][1-dir]){dir=1-dir;paint()}});inp.addEventListener('input',()=>{inp.value=inp.value.toUpperCase().replace(/[^A-ZÑ]/g,'');td.classList.remove('ok','bad');if(inp.value)move(k,1)});inp.addEventListener('keydown',ev=>{if(ev.key==='Backspace'&&!inp.value){ev.preventDefault();move(k,-1);if(cells[cur])cells[cur].inp.value=''}else{const dirs={ArrowRight:[0,1,0],ArrowLeft:[0,-1,0],ArrowDown:[1,0,1],ArrowUp:[-1,0,1]};if(dirs[ev.key]){ev.preventDefault();const [dr,dc,d]=dirs[ev.key];const [rr,cc]=k.split(',').map(Number);const next=(rr+dr)+','+(cc+dc);if(cells[next]&&cover[next][d]){dir=d;cells[next].inp.focus()}}}})}else td.className='empty';tr.append(td)}grid.append(tr)}
function active(){return cur?(cover[cur][dir]||cover[cur][1-dir]):null}
function paint(){Object.values(cells).forEach(x=>x.td.classList.remove('hl','cur'));document.querySelectorAll('.clue').forEach(x=>x.classList.remove('active'));const e=active();if(!e)return;for(let i=0;i<e.w.length;i++)cells[(e.r+(e.d?i:0))+','+(e.c+(e.d?0:i))].td.classList.add('hl');cells[cur].td.classList.add('cur');document.getElementById('clue-'+e.n)?.classList.add('active')}
function move(k,step){const e=active();if(!e)return;const [r,c]=k.split(',').map(Number),next=(r+(e.d?step:0))+','+(c+(e.d?0:step));if(cells[next]&&cover[next][e.d])cells[next].inp.focus()}
for(const [d,id] of [[0,'across'],[1,'down']]){const ol=document.getElementById(id);L.entries.filter(e=>e.d===d).sort((a,b)=>a.n-b.n).forEach(e=>{const li=document.createElement('li');li.className='clue';li.id='clue-'+e.n;li.textContent=e.n+'. ('+e.w.length+' letras) — '+e.clue;li.onclick=()=>{dir=e.d;cells[e.r+','+e.c].inp.focus();paint()};ol.append(li)})}
const msg=document.getElementById('msg');document.getElementById('check').onclick=()=>{let ok=0,bad=0,empty=0;for(const [k,x] of Object.entries(cells)){x.td.classList.remove('ok','bad');if(!x.inp.value)empty++;else if(x.inp.value===cover[k].ch){ok++;x.td.classList.add('ok')}else{bad++;x.td.classList.add('bad')}}msg.textContent=!bad&&!empty?'¡Felicidades! Crucigrama completo.':`Correctas: ${ok} · Incorrectas: ${bad} · Vacías: ${empty}`};document.getElementById('hint').onclick=()=>{if(!cur){msg.textContent='Seleccioná primero una casilla.';return}cells[cur].inp.value=cover[cur].ch;cells[cur].td.classList.add('ok')};document.getElementById('reveal').onclick=()=>{for(const [k,x] of Object.entries(cells)){x.inp.value=cover[k].ch;x.td.classList.remove('bad');x.td.classList.add('ok')}};document.getElementById('clear').onclick=()=>{for(const x of Object.values(cells)){x.inp.value='';x.td.classList.remove('ok','bad')}msg.textContent=''};
function drawSheet(solved){const scale=2,cell=35,margin=54,width=Math.max(850,L.W*cell+2*margin),boardHeight=L.H*cell;const measure=document.createElement('canvas').getContext('2d');measure.font='17px Arial';const maxTextWidth=width-2*margin;function wrap(t){const words=t.split(' '),lines=[];let line='';for(const word of words){const candidate=line?line+' '+word:word;if(measure.measureText(candidate).width>maxTextWidth&&line){lines.push(line);line=word}else line=candidate}if(line)lines.push(line);return lines}let sections=[];for(const [d,title] of [[0,'Horizontales'],[1,'Verticales']]){const items=L.entries.filter(e=>e.d===d).sort((a,b)=>a.n-b.n).map(e=>wrap(e.n+'. ('+e.w.length+' letras) '+e.clue));sections.push({title,items})}let cluesHeight=sections.reduce((sum,s)=>sum+48+s.items.reduce((v,lines)=>v+lines.length*23+12,0),0);let height=margin+80+boardHeight+40+cluesHeight+margin;const canvas=document.createElement('canvas');canvas.width=width*scale;canvas.height=height*scale;const ctx=canvas.getContext('2d');ctx.scale(scale,scale);ctx.fillStyle='white';ctx.fillRect(0,0,width,height);ctx.fillStyle='#182536';ctx.font='bold 26px Arial';ctx.fillText('Crucigrama de Sistemas de Información',margin,margin);ctx.font='16px Arial';ctx.fillText('Servicios médicos · '+(solved?'Solucionario':'Práctica para estudiantes'),margin,margin+29);const x0=Math.round((width-L.W*cell)/2),y0=margin+75;for(const [k,v] of Object.entries(cover)){const [r,c]=k.split(',').map(Number),x=x0+c*cell,y=y0+r*cell;ctx.fillStyle='white';ctx.fillRect(x,y,cell,cell);ctx.strokeStyle='#29384a';ctx.lineWidth=1.3;ctx.strokeRect(x,y,cell,cell);if(numAt[k]){ctx.fillStyle='#526173';ctx.font='bold 10px Arial';ctx.fillText(numAt[k],x+3,y+10)}if(solved){ctx.fillStyle='#182536';ctx.font='bold 20px Arial';ctx.textAlign='center';ctx.fillText(v.ch,x+cell/2,y+cell/2+7);ctx.textAlign='left'}}let yy=y0+boardHeight+36;for(const s of sections){ctx.fillStyle='#0f766e';ctx.font='bold 20px Arial';ctx.fillText(s.title,margin,yy);yy+=33;ctx.fillStyle='#182536';ctx.font='17px Arial';for(const lines of s.items){for(const line of lines){ctx.fillText(line,margin,yy);yy+=23}yy+=12}yy+=12}return canvas}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function downloadPNG(solved){drawSheet(solved).toBlob(blob=>{if(blob)downloadBlob(blob,'crucigrama-'+(solved?'resuelto':'en-blanco')+'.png')},'image/png')}
function downloadPDF(solved){const canvas=drawSheet(solved);const win=window.open('','_blank');if(!win){msg.textContent='Permití ventanas emergentes para generar el PDF.';return}const url=canvas.toDataURL('image/png');win.document.write('<!DOCTYPE html><html lang="es"><head><title>Crucigrama para imprimir</title><style>@page{size:A4;margin:10mm}body{margin:0}img{display:block;width:100%;height:auto;page-break-inside:avoid}@media print{img{max-width:100%}}</style></head><body><img src="'+url+'" onload="setTimeout(()=>window.print(),250)"></body></html>');win.document.close();msg.textContent='En la ventana de impresión, elegí «Guardar como PDF». Si el contenido es largo, seleccioná una escala menor.'}
document.getElementById('pngBlank').onclick=()=>downloadPNG(false);document.getElementById('pngSolved').onclick=()=>downloadPNG(true);document.getElementById('pdfBlank').onclick=()=>downloadPDF(false);document.getElementById('pdfSolved').onclick=()=>downloadPDF(true);
</script></body></html>
